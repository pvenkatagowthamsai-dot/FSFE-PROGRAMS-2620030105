<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Registration Form</title>
</head>
<body>
  <h2>Employee Registration Form</h2>

  <form action="#" method="post" enctype="multipart/form-data">

    <label for="name">Employee Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter your name" required>
    <br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>
    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>
    <br><br>

    <label for="mobile">Mobile Number:</label>
    <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" required>
    <br><br>

    <label for="age">Age:</label>
    <input type="number" id="age" name="age" min="18" max="65" style="width:50px;">
    <br><br>

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob">
    <br><br>

    <label for="time">Preferred Interview Time:</label>
    <input type="time" id="time" name="time">
    <br><br>

    <label>Gender:</label>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label>
    <br><br>

    <label>Skills:</label>
    <input type="checkbox" id="html" name="skills" value="html">
    <label for="html">HTML</label>
    <input type="checkbox" id="css" name="skills" value="css">
    <label for="css">CSS</label>
    <input type="checkbox" id="js" name="skills" value="javascript">
    <label for="js">JavaScript</label>
    <br><br>

    <label for="department">Select Department:</label>
    <select id="department" name="department">
      <option value="">Select Department</option>
      <option value="it">IT</option>
      <option value="hr">HR</option>
      <option value="finance">Finance</option>
      <option value="marketing">Marketing</option>
    </select>
    <br><br>

    <label for="resume">Upload Resume:</label>
    <input type="file" id="resume" name="resume">
    <br><br>

    <label for="address">Address:</label>
    <textarea id="address" name="address" rows="6" cols="30" placeholder="Enter your address"></textarea>
    <br><br>

    <label for="experience">Work Experience:</label>
    <input type="range" id="experience" name="experience" min="0" max="20" value="5">
    <br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

  </form>
</body>
</html>
