<html>
    <head>
        <title>Registration</title>
    </head>
    <body align="centre">
        <h1> Registration Page</h1>
        <form>
            Name : <input type="text" name="g1" placeholder="Enter your name">
            Email : <input type="email" name="g2" placeholder="abc@klh.edu.in">
            Mobile : <input type="tel" name="g3" placeholder="Mobile number" pattern="[0-9]"{10} required><br><br>

            Course : <select name="g4" required>
                <option value="1">SELECT</option>
                <option>B.Tech</option>
                <option>M.Tech</option>
                <option>P.hD</option>
            </select><br><br>
            Gender : <input type="radio" name="g5" required>Male
            <input type="radio" name="g5">Female<br><br>

            Address : <textarea name="g6" required rows="3" cols="30"
            placeholder="Enter your address">
        </textarea><br><br>

        Skills Known : <input type="checkbox" name="g7">html 
        <input type="checkbox" name="g7">CSS
        <input type="checkbox" name="g7">Java Script
        <input type="checkbox" name="g7">PHP<BR><br>

            Inter Percentage : <input type="number" name="g8" min="0" max="100"
            required><br><br>

            Upload Photo : <input type="file" name="g9" accept=".jpg,.jpeg,.png"><br><br>

            Password : <input type="password" name="g10" minilength="6" required><br><br>

            <input type="checkbox" name="g11" required> I agree to the term.<br><br>

            <button type="submit"> Register</button>
        </form>
    </body>
</html>
