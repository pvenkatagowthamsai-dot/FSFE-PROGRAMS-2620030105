<!DOCTYPE html>
<html>
<head>
    <title>Student Table</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: lightblue;
        }
    </style>
</head>
<body>

    <h2>Student Details</h2>

    <table>
        <tr>
            <th>Student Title</th>
        </tr>
        <tr>
            <td>Mr. John</td>
        </tr>
        <tr>
            <td>Ms. Sarah</td>
        </tr>
        <tr>
            <td>Dr. David</td>
        </tr>
    </table>

</body>
</html>
